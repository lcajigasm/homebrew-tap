# Removed after the first successful workflow_dispatch of update.yml.
# The agent token can merge and read Actions, and it cannot create a
# workflow_dispatch event. This job uses the workflow GITHUB_TOKEN, which can.
name: Dispatch update once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-update-once.yml

permissions:
  actions: write

jobs:
  dispatch:
    name: workflow_dispatch update.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the updater on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main
