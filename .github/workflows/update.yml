name: Update

on:
  schedule:
    # GitHub delays schedule events and drops them when the queue is busy.
    # One slot per hour (the old "23 * * * *") left releases unpublished:
    # the 21:23 and 22:23 UTC runs on 2026-11-01 were never created.
    # These four minutes are the retry. They stay off :00. ubuntu-latest
    # on this public repository is a free standard runner.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tap
  cancel-in-progress: false

jobs:
  update:
    name: refresh from public releases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Disk image listing tool
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Regenerate version, url and sha256
        id: refresh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # Same workflow token as the commit step. The script uses it only
          # after the public API returns 403 or 429.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 script/update_tap.py
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit to main when a release changed
        # Runs even when another program failed, so the ones that succeeded
        # still land on main. The next step turns the job red.
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No formula or cask changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update formulae from upstream releases"
          git push origin HEAD:main

      - name: Fail when a program could not be updated
        if: steps.refresh.outputs.code != '0'
        run: |
          echo "One or more programs failed. The summary is in the refresh step."
          exit 1
