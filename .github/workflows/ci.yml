name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  updater:
    name: updater tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Independent release updates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 script/test_update_tap.py

  tap:
    name: style, audit, install
    # macos-14 is in its retirement brownout (gone on 2026-11-02).
    # macos-15 is the free standard image. Larger labels are paid.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # Workflow token, not a stored secret. Unauthenticated brew update and
      # brew audit --online share 60 GitHub API requests per hour per runner
      # IP, so the push to main that follows a green pull request fails with
      # "API rate limit exceeded".
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Homebrew
        # Keep Homebrew current so the cask token check for `lux` stays
        # behind --strict (homebrew-core has an unrelated formula of that
        # name) and the minimum macOS audit matches depends_on :macos.
        run: brew update

      - name: Point the tap at this checkout
        run: |
          set -euo pipefail
          tap="$(brew --repository)/Library/Taps/lcajigasm/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          rm -rf "$tap"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          brew trust lcajigasm/tap

      - name: brew style and brew audit
        run: |
          set -euo pipefail
          brew style --display-cop-names lcajigasm/tap
          brew audit --online --tap lcajigasm/tap

      - name: brew install omega, ownterm and lux
        run: |
          set -euo pipefail
          brew install lcajigasm/tap/omega
          brew install --cask lcajigasm/tap/ownterm
          brew install --cask lcajigasm/tap/lux

          echo "===== brew install omega ====="
          command -v omega
          omega --version
          omega steps

          echo "===== brew install --cask ownterm ====="
          brew info --cask lcajigasm/tap/ownterm
          ownterm_app=""
          for candidate in \
            /Applications/OwnTerm.app \
            "$HOME/Applications/OwnTerm.app" \
            "$(brew --prefix)/Caskroom/ownterm/"*/OwnTerm.app
          do
            if [[ -d "$candidate" ]]; then
              ownterm_app="$candidate"
              break
            fi
          done
          if [[ -z "$ownterm_app" ]]; then
            echo "OwnTerm.app was not installed" >&2
            exit 1
          fi
          echo "OwnTerm.app: $ownterm_app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$ownterm_app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ownterm_app/Contents/Info.plist"
          ownterm_exe=""
          for candidate in "$ownterm_app/Contents/MacOS"/*; do
            if [[ -f "$candidate" && -x "$candidate" ]]; then
              ownterm_exe="$candidate"
              break
            fi
          done
          if [[ -z "$ownterm_exe" ]]; then
            echo "OwnTerm.app has no executable" >&2
            exit 1
          fi
          echo "executable: $ownterm_exe"

          echo "===== brew install --cask lux ====="
          brew info --cask lcajigasm/tap/lux
          app=""
          for candidate in \
            /Applications/Lux.app \
            "$HOME/Applications/Lux.app" \
            "$(brew --prefix)/Caskroom/lux/"*/Lux.app
          do
            if [[ -d "$candidate" ]]; then
              app="$candidate"
              break
            fi
          done
          if [[ -z "$app" ]]; then
            echo "Lux.app was not installed" >&2
            exit 1
          fi
          echo "Lux.app: $app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/lux"
          lux_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [[ -z "$lux_version" ]]; then
            echo "Lux.app has no CFBundleShortVersionString" >&2
            exit 1
          fi
          echo "lux version: $lux_version"
